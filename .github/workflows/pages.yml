name: Deploy soft launch to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp deployment/app.js _site/app.js
          cp deployment/brand-overrides.js _site/brand-overrides.js
          cp deployment/nav-fix.js _site/nav-fix.js
          cp deployment/soft-launch.js _site/soft-launch.js
          cp deployment/pages-compat.js _site/pages-compat.js
          cp deployment/style.css _site/style.css
          cp deployment/font-fix.css _site/font-fix.css
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="vi">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta name="theme-color" content="#12848b">
              <title>Adxchange — Vietnam DOOH Marketplace</title>
              <meta name="description" content="Adxchange — nền tảng mạng lưới màn hình quảng cáo DOOH tại Việt Nam">
              <link rel="stylesheet" href="./style.css?v=soft-launch">
              <link rel="stylesheet" href="./font-fix.css?v=soft-launch">
            </head>
            <body>
              <div id="app"></div>
              <script src="./app.js?v=soft-launch" defer></script>
              <script src="./brand-overrides.js?v=soft-launch" defer></script>
              <script src="./nav-fix.js?v=soft-launch" defer></script>
              <script src="./soft-launch.js?v=soft-launch" defer></script>
              <script src="./pages-compat.js?v=soft-launch" defer></script>
            </body>
          </html>
          EOF
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
