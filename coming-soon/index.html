<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adxchange Agency - We are coming back soon</title>
<meta name="description" content="Adxchange Agency - We are coming back soon">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#0f7c86 0%,#0c5f69 55%,#0a4a53 100%)}
main{max-width:680px}
.brand{font-size:14px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;opacity:.9}
h1{margin:28px 0 16px;font-size:clamp(34px,7vw,64px);line-height:1.08;font-weight:800;letter-spacing:-.02em}
p{font-size:clamp(16px,2.4vw,20px);line-height:1.6;opacity:.85}
.dot{display:inline-block;width:10px;height:10px;margin-top:40px;border-radius:50%;background:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
</style>
</head>
<body>
<main>
<div class="brand">Adxchange Agency</div>
<h1>We are coming back soon</h1>
<p>We are giving our website a fresh new look. Please check back shortly.</p>
<span class="dot" aria-hidden="true"></span>
</main>
</body>
</html>
